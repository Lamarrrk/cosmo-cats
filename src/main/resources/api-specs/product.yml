openapi: 3.0.1
info:
  title: Product Management API
  version: v1
  description: API for managing products in the system.

servers:
  - url: http://localhost:8080
    description: Cosmocats

paths:
  /api/v1/products:
    get:
      summary: Get all products
      operationId: getAllProducts
      responses:
        '200':
          description: OK
    post:
      summary: Create product
      operationId: createProduct
      requestBody:
        required: true
      responses:
        '201':
          description: Created

  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product found
        '404':
          description: Not found

    put:
      summary: Update product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
      responses:
        '200':
          description: Updated
        '404':
          description: Not found

    delete:
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No content
        '404':
          description: Not found


